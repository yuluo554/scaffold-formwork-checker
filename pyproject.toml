[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold-formwork-checker"
version = "2.0.0"
description = "脚手架与模板支架安全验算及危大分级工具（规范公式验算 + 专项方案文本核查 + 危大/超规模分级判定，CLI/桌面双通路，全离线）"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639：SPDX 表达式字符串（TOML 表写法已被 setuptools 弃用，硬期限 2027-02-18）
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = [
    "scaffold",
    "formwork",
    "construction-safety",
    "structural-calculation",
    "jgj130",
    "jgj162",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# 核心引擎零依赖（确定性纯 Python）；可选能力走 extras
dependencies = []

[project.optional-dependencies]
# dev 必须覆盖测试期真实 import（口径：防"悄悄少跑"）——synth 冻结测试 import docx，M3 解析测试 import pypdf；pyyaml=workflow 守门解析
# 下限=2.0.0 实测验证过的线（pytest 9.1.1 / python-docx 1.2.0 / pypdf 6.21.1 下全绿）
dev = ["pytest>=8", "python-docx>=1.1", "pypdf>=5", "pyyaml>=6",
       "tomli>=2; python_version < '3.11'"]
parse = ["python-docx>=1.1", "pypdf>=5"]
report = ["python-docx>=1.1"]
# floor 抬到 3.10 后 PySide6 6.7+ 可解析；上限 <7 防跨大版本破坏（6.12.0 实测）
gui = ["PySide6>=6.6,<7"]
# floor 抬到 3.10 后 PyInstaller 6.x 可用（6.22.3 实测重建 exe）；上限 <7 防跨大版本
build = ["pyinstaller>=6,<7"]

[project.scripts]
sfc = "scaffold_formwork_checker.cli:main"

[project.gui-scripts]
sfc-gui = "scaffold_formwork_checker.gui.app:main"

[project.urls]
# GitHub 仓库地址于 M6 发布时补充（plan/06 #3）

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
